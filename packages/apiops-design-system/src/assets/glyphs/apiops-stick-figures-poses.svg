<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ns1="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:ns2="http://www.inkscape.org/namespaces/inkscape" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title description" version="1.1" id="svg277" ns1:docname="apiops-stick-figures-poses.svg">
  <ns1:namedview id="namedview279" pagecolor="#ffffff" bordercolor="#000000" borderopacity="0.25" ns2:showpageshadow="2" ns2:pageopacity="0.0" ns2:pagecheckerboard="0" ns2:deskcolor="#d1d1d1" />
  <title id="title">APIOps Compact Pose Vocabulary</title>
  <desc id="description">
    Ten reusable APIOps poses built from the compact, smooth and abstract
    human figure system.
  </desc>
  <defs id="defs193">
    <style id="style4">

      :root, svg {
        --apiops-ink: #10233f;
        --apiops-muted: #647184;
        --apiops-paper: #ffffff;
        --apiops-border: #dfe5ec;
        --apiops-accent: #67389b;
      }
.body {
        fill: none;
        stroke: var(--apiops-ink, #10233f);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .detail {
        fill: none;
        stroke: var(--apiops-ink, #10233f);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .accent {
        fill: var(--apiops-accent, currentColor);
        stroke: none;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .label {
        font-family: Inter, Arial, sans-serif;
        font-size: 18px;
        font-weight: 600;
        fill: var(--apiops-ink, #10233f);
        text-anchor: middle;
      }

      .tile {
        fill: var(--apiops-paper, #ffffff);
        stroke: var(--apiops-border, #dfe5ec);
        stroke-width: 1.5;
      }
    </style>
