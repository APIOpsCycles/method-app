<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title description">
  <title id="title">APIOps Character Notation Blocks</title>
  <desc id="description">Reusable symbols and connection styles for APIOps character grammar compositions.</desc>
  <defs>
    <style>
      :root, svg {
        --apiops-ink: #10233f;
        --apiops-muted: #647184;
        --apiops-paper: #ffffff;
        --apiops-border: #dfe5ec;
        --apiops-accent: transparent;
      }
      .base { fill: none; stroke: var(--apiops-ink, #10233f); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .fine { fill: none; stroke: var(--apiops-ink, #10233f); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .dash { fill: none; stroke: var(--apiops-ink, #10233f); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 10; }
      .accent { fill: var(--apiops-accent, currentColor); stroke: none; }
      .paper { fill: var(--apiops-paper, #ffffff); stroke: var(--apiops-ink, #10233f); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .soft { fill: #f7f8fa; stroke: var(--apiops-border, #dfe5ec); stroke-width: 1.5; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 800; fill: var(--apiops-ink, #10233f); text-anchor: middle; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 800; fill: var(--apiops-ink, #10233f); text-anchor: middle; }
      .tile-label { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 750; fill: var(--apiops-ink, #10233f); text-anchor: middle; }
    </style>

