<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1440"
  height="620"
  viewBox="0 0 1440 620"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">APIOps Icon Examples</title>
  <desc id="description">
    Twelve reusable APIOps visual-language icons based on smooth routes,
    structural circles, stations and connected journeys.
  </desc>

  <defs>
    <style>
      .base {
        fill: none;
        stroke: #10233f;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .fine {
        fill: none;
        stroke: #10233f;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .accent {
        fill: none;
        stroke: currentColor;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .station {
        fill: #ffffff;
        stroke: currentColor;
        stroke-width: 4;
      }

      .label {
        font-family: Inter, Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #10233f;
        text-anchor: middle;
      }

      .description {
        font-family: Inter, Arial, sans-serif;
        font-size: 13px;
        font-weight: 400;
        fill: #647184;
        text-anchor: middle;
      }

      .tile {
        fill: #ffffff;
        stroke: #dfe5ec;
        stroke-width: 1.5;
      }
    </style>

    <!-- 1. Insight -->
    <symbol id="icon-insight" viewBox="0 0 120 120">
      <path
        d="M36 72
           C27 64 23 54 23 43
           C23 23 39 10 59 10
           C79 10 95 23 95 43
           C95 55 90 64 82 72
           C76 78 73 83 73 90
           H47
           C47 83 43 78 36 72Z"
        class="base"
      />

      <path d="M47 98 H73" class="base"/>
      <path d="M52 106 H68" class="base"/>

      <path d="M24 88 H96" class="base"/>

      <circle
        cx="60"
        cy="88"
        r="11"
        class="station"
      />
    </symbol>

    <!-- 2. Decision -->
    <symbol id="icon-decision" viewBox="0 0 120 120">
      <circle
        cx="48"
        cy="47"
        r="31"
        class="base"
      />

      <path
        d="M33 47 L44 58 L65 35"
        class="accent"
      />

      <path
        d="M48 78
           C48 88 55 94 65 94
           H91"
        class="base"
      />

      <circle
        cx="98"
        cy="94"
        r="10"
        class="station"
      />
    </symbol>

    <!-- 3. Conversation -->
    <symbol id="icon-conversation" viewBox="0 0 140 120">
      <path
        d="M34 28
           C34 16 43 10 55 10
           H91
           C103 10 112 16 112 28
           V62
           C112 74 103 80 91 80
           H55
           C43 80 34 74 34 62Z"
        class="base"
      />

      <path d="M34 64 L22 79" class="base"/>

      <circle cx="59" cy="44" r="3.5" fill="#10233f"/>
      <circle cx="73" cy="44" r="3.5" fill="#10233f"/>
      <circle cx="87" cy="44" r="3.5" fill="#10233f"/>

      <path d="M20 94 H120" class="base"/>

      <circle cx="20" cy="94" r="11" class="station"/>
      <circle cx="120" cy="94" r="11" class="station"/>
    </symbol>

    <!-- 4. Opportunity -->
    <symbol id="icon-opportunity" viewBox="0 0 130 120">
      <circle cx="25" cy="91" r="11" class="station"/>

      <path
        d="M36 87
           C51 79 61 67 68 53
           C75 39 82 27 96 18"
        class="base"
      />

      <path
        d="M48 83
           C63 84 77 89 93 98"
        class="base"
      />

      <circle cx="102" cy="14" r="11" class="station"/>
      <circle cx="103" cy="103" r="11" class="station"/>
    </symbol>

    <!-- 5. Capability -->
    <symbol id="icon-capability" viewBox="0 0 140 120">
      <path d="M22 61 H118" class="base"/>

      <circle cx="22" cy="61" r="12" class="station"/>
      <circle cx="70" cy="61" r="12" class="station"/>
      <circle cx="118" cy="61" r="12" class="station"/>
    </symbol>

    <!-- 6. Value -->
    <symbol id="icon-value" viewBox="0 0 130 120">
      <circle cx="37" cy="82" r="15" class="base"/>

      <path
        d="M50 77
           C68 70 82 57 91 42
           C97 32 101 23 104 14"
        class="base"
      />

      <path
        d="M90 25 L104 14 L108 31"
        class="base"
      />

      <circle cx="107" cy="12" r="10" class="station"/>
    </symbol>

    <!-- 7. People -->
    <symbol id="icon-people" viewBox="0 0 150 120">
      <circle cx="52" cy="31" r="13" class="base"/>
      <circle cx="98" cy="31" r="13" class="base"/>

      <path
        d="M38 76
           C40 58 45 49 52 49
           C59 49 64 58 66 76
           V91"
        class="base"
      />

      <path
        d="M84 76
           C86 58 91 49 98 49
           C105 49 110 58 112 76
           V91"
        class="base"
      />

      <path d="M28 92 H122" class="base"/>

      <circle cx="28" cy="92" r="11" class="station"/>
      <circle cx="122" cy="92" r="11" class="station"/>
    </symbol>

    <!-- 8. Alignment -->
    <symbol id="icon-alignment" viewBox="0 0 150 120">
      <circle cx="75" cy="60" r="42" class="base"/>

      <path d="M23 60 H127" class="base"/>

      <circle cx="23" cy="60" r="11" class="station"/>
      <circle cx="75" cy="60" r="11" class="station"/>
      <circle cx="127" cy="60" r="11" class="station"/>
    </symbol>

    <!-- 9. Risk -->
    <symbol id="icon-risk" viewBox="0 0 150 120">
      <path
        d="M14 61 H52"
        class="base"
        stroke-dasharray="10 10"
      />

      <path
        d="M98 61 H136"
        class="base"
        stroke-dasharray="10 10"
      />

      <circle
        cx="75"
        cy="61"
        r="22"
        fill="#ffffff"
        stroke="currentColor"
        stroke-width="4"
      />

      <path
        d="M65 51 L85 71
           M85 51 L65 71"
        class="accent"
      />
    </symbol>

    <!-- 10. Quality -->
    <symbol id="icon-quality" viewBox="0 0 150 120">
      <path d="M17 65 H42" class="base"/>

      <circle cx="75" cy="60" r="36" class="base"/>

      <path
        d="M57 60 L69 72 L91 47"
        class="accent"
      />

      <path d="M108 65 H133" class="base"/>

      <circle cx="121" cy="65" r="11" class="station"/>
    </symbol>

    <!-- 11. Flow -->
    <symbol id="icon-flow" viewBox="0 0 150 120">
      <circle cx="22" cy="73" r="11" class="station"/>

      <path
        d="M33 73
           C50 73 54 66 62 55
           C70 44 78 37 94 37
           H116"
        class="base"
      />

      <circle cx="127" cy="37" r="11" class="station"/>
    </symbol>

    <!-- 12. Learn -->
    <symbol id="icon-learn" viewBox="0 0 140 120">
      <path
        d="M29 79
           C17 68 15 50 24 36
           C33 22 50 17 65 23
           C79 29 86 44 82 58
           C79 69 70 77 59 79"
        class="base"
      />

      <path
        d="M58 79
           C69 80 82 82 94 87"
        class="base"
      />

      <circle cx="101" cy="90" r="11" class="station"/>

      <circle
        cx="53"
        cy="50"
        r="11"
        class="accent"
      />
    </symbol>
  </defs>

  <rect width="1440" height="620" fill="#f7f8fa"/>

  <!-- Row 1 -->

  <g transform="translate(25 25)" color="#2F7D32">
    <rect width="210" height="260" rx="18" class="tile"/>
    <use href="#icon-insight" x="45" y="25" width="120" height="120"/>
    <text x="105" y="178" class="label">Insight</text>
    <text x="105" y="205" class="description">Understanding</text>
    <text x="105" y="224" class="description">emerges</text>
  </g>

  <g transform="translate(260 25)" color="#67389B">
    <rect width="210" height="260" rx="18" class="tile"/>
    <use href="#icon-decision" x="45" y="25" width="120" height="120"/>
    <text x="105" y="178" class="label">Decision</text>
    <text x="105" y="205" class="description">Commit and</text>
    <text x="105" y="224" class="description">move forward</text>
  </g>

  <g transform="translate(495 25)" color="#00A6A6">
    <rect width="210" height="260" rx="18" class="tile"/>
    <use href="#icon-conversation" x="35" y="25" width="140" height="120"/>
    <text x="105" y="178" class="label">Conversation</text>
    <text x="105" y="205" class="description">Dialogue creates</text>
    <text x="105" y="224" class="description">shared understanding</text>
  </g>

  <g transform="translate(730 25)" color="#E64C19">
    <rect width="210" height="260" rx="18" class="tile"/>
    <use href="#icon-opportunity" x="40" y="25" width="130" height="120"/>
    <text x="105" y="178" class="label">Opportunity</text>
    <text x="105" y="205" class="description">Explore and</text>
    <text x="105" y="224" class="description">create options</text>
  </g>

  <g transform="translate(965 25)" color="#1656B8">
    <rect width="210" height="260" rx="18" class="tile"/>
    <use href="#icon-capability" x="35" y="25" width="140" height="120"/>
    <text x="105" y="178" class="label">Capability</text>
    <text x="105" y="205" class="description">Build, integrate</text>
    <text x="105" y="224" class="description">and reuse</text>
  </g>

  <g transform="translate(1200 25)" color="#2F7D32">
    <rect width="210" height="260" rx="18" class="tile"/>
    <use href="#icon-value" x="40" y="25" width="130" height="120"/>
    <text x="105" y="178" class="label">Value</text>
    <text x="105" y="205" class="description">Deliver impact</text>
    <text x="105" y="224" class="description">that matters</text>
  </g>

  <!-- Row 2 -->

  <g transform="translate(25 315)" color="#00A6A6">
    <rect width="210" height="260" rx="18" class="tile"/>
    <use href="#icon-people" x="30" y="25" width="150" height="120"/>
    <text x="105" y="178" class="label">People</text>
    <text x="105" y="205" class="description">Involve the</text>
    <text x="105" y="224" class="description">right people</text>
  </g>

  <g transform="translate(260 315)" color="#2F7D32">
    <rect width="210" height="260" rx="18" class="tile"/>
    <use href="#icon-alignment" x="30" y="25" width="150" height="120"/>
    <text x="105" y="178" class="label">Alignment</text>
    <text x="105" y="205" class="description">Connect around</text>
    <text x="105" y="224" class="description">shared goals</text>
  </g>

  <g transform="translate(495 315)" color="#E64C19">
    <rect width="210" height="260" rx="18" class="tile"/>
    <use href="#icon-risk" x="30" y="25" width="150" height="120"/>
    <text x="105" y="178" class="label">Risk</text>
    <text x="105" y="205" class="description">Identify and</text>
    <text x="105" y="224" class="description">mitigate early</text>
  </g>

  <g transform="translate(730 315)" color="#00A6A6">
    <rect width="210" height="260" rx="18" class="tile"/>
    <use href="#icon-quality" x="30" y="25" width="150" height="120"/>
    <text x="105" y="178" class="label">Quality</text>
    <text x="105" y="205" class="description">Built in, not</text>
    <text x="105" y="224" class="description">bolted on</text>
  </g>

  <g transform="translate(965 315)" color="#67389B">
    <rect width="210" height="260" rx="18" class="tile"/>
    <use href="#icon-flow" x="30" y="25" width="150" height="120"/>
    <text x="105" y="178" class="label">Flow</text>
    <text x="105" y="205" class="description">Smooth handoffs,</text>
    <text x="105" y="224" class="description">less friction</text>
  </g>

  <g transform="translate(1200 315)" color="#1656B8">
    <rect width="210" height="260" rx="18" class="tile"/>
    <use href="#icon-learn" x="35" y="25" width="140" height="120"/>
    <text x="105" y="178" class="label">Learn</text>
    <text x="105" y="205" class="description">Measure, learn</text>
    <text x="105" y="224" class="description">and improve</text>
  </g>
</svg>