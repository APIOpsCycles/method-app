<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 390"><title>Capability Productization Cycle: eight stations with feedback</title><desc>Original simplified teaching diagram based on APIOps Cycles method-data 4.2.1. APIOps Cycles / Osaango Ltd. CC-BY-SA 4.0. Read top row left to right, then bottom row right to left; feedback returns to earlier decisions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#888" stroke-width="1.5"/></marker></defs><rect width="1152" height="390" fill="white"/><g fill="#333333" font-family="Arial, sans-serif"><path d="M120 95 H1005 V275 H120" fill="none" stroke="#707070" stroke-width="7"/><path d="M120 250 V140" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/><g><circle cx="120" cy="95" r="23" fill="white" stroke="#444444" stroke-width="4"/><text x="120" y="102" text-anchor="middle" font-size="21" font-weight="700">1</text><text x="120" y="147" text-anchor="middle" font-size="23">Strategy</text></g><g><circle cx="415" cy="95" r="23" fill="white" stroke="#444444" stroke-width="4"/><text x="415" y="102" text-anchor="middle" font-size="21" font-weight="700">2</text><text x="415" y="147" text-anchor="middle" font-size="23">Consumer / producer</text><text x="415" y="175" text-anchor="middle" font-size="23">requirements</text></g><g><circle cx="710" cy="95" r="23" fill="white" stroke="#444444" stroke-width="4"/><text x="710" y="102" text-anchor="middle" font-size="21" font-weight="700">3</text><text x="710" y="147" text-anchor="middle" font-size="23">Architecture /</text><text x="710" y="175" text-anchor="middle" font-size="23">platform decisions</text></g><g><circle cx="1005" cy="95" r="23" fill="white" stroke="#444444" stroke-width="4"/><text x="1005" y="102" text-anchor="middle" font-size="21" font-weight="700">4</text><text x="1005" y="147" text-anchor="middle" font-size="23">Solution /</text><text x="1005" y="175" text-anchor="middle" font-size="23">interaction design</text></g><g><circle cx="1005" cy="275" r="23" fill="white" stroke="#444444" stroke-width="4"/><text x="1005" y="282" text-anchor="middle" font-size="21" font-weight="700">5</text><text x="1005" y="327" text-anchor="middle" font-size="23">Delivery / operations</text></g><g><circle cx="710" cy="275" r="23" fill="white" stroke="#444444" stroke-width="4"/><text x="710" y="282" text-anchor="middle" font-size="21" font-weight="700">6</text><text x="710" y="327" text-anchor="middle" font-size="23">Readiness assurance</text></g><g><circle cx="415" cy="275" r="23" fill="white" stroke="#444444" stroke-width="4"/><text x="415" y="282" text-anchor="middle" font-size="21" font-weight="700">7</text><text x="415" y="327" text-anchor="middle" font-size="23">Publishing /</text><text x="415" y="355" text-anchor="middle" font-size="23">enablement</text></g><g><circle cx="120" cy="275" r="23" fill="white" stroke="#444444" stroke-width="4"/><text x="120" y="282" text-anchor="middle" font-size="21" font-weight="700">8</text><text x="120" y="327" text-anchor="middle" font-size="23">Monitoring /</text><text x="120" y="355" text-anchor="middle" font-size="23">improvement</text></g><text x="568" y="209" text-anchor="middle" fill="#555555" font-size="22">Feedback can change any earlier decision</text></g></svg>