<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="444" viewBox="0 0 1200 444" role="img" aria-labelledby="title desc"><title id="title">A worked decision board for the payment pilot</title><desc id="desc">Four connected questions: consumer consequence, lifecycle work, owned intervention, and evidence with decision boundaries. This is a fictional example, not a passed assessment.</desc><metadata>APIOps Cycles / Osaango Ltd, CC-BY-SA 4.0. Paper 2 editorial illustration; fictional supplier-payment example. Not a canonical method canvas, assessment result or prescribed metro route.</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#555" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#252525"><rect x="8" y="8" width="580" height="202" rx="8" fill="#f7f9fc" stroke="#1656b8" stroke-width="2"/><text x="28" y="47" font-size="27" font-weight="700"><tspan x="28" dy="0">1 / Consumer consequence</tspan></text><text x="28" y="88" font-size="25" font-weight="400"><tspan x="28" dy="0">Portal says “Submitted”.</tspan><tspan x="28" dy="30">The owner cannot tell whether</tspan><tspan x="28" dy="30">payment is pending or complete.</tspan><tspan x="28" dy="30">A retry may repeat the instruction.</tspan></text><rect x="608" y="8" width="580" height="202" rx="8" fill="#f7f9fc" stroke="#1656b8" stroke-width="2"/><text x="628" y="47" font-size="27" font-weight="700"><tspan x="628" dy="0">2 / Work to connect</tspan></text><text x="628" y="88" font-size="25" font-weight="400"><tspan x="628" dy="0">Consumer Experience: payment journey.</tspan><tspan x="628" dy="30">API Design: submission and recovery.</tspan><tspan x="628" dy="30">Roles and Operating Guidelines:</tspan><tspan x="628" dy="30">who maintains the decisions.</tspan></text><rect x="8" y="226" width="580" height="202" rx="8" fill="#f7f9fc" stroke="#1656b8" stroke-width="2"/><text x="28" y="265" font-size="27" font-weight="700"><tspan x="28" dy="0">3 / Owned intervention</tspan></text><text x="28" y="306" font-size="25" font-weight="400"><tspan x="28" dy="0">API owner coordinates with partner</tspan><tspan x="28" dy="30">developers and payment operations.</tspan><tspan x="28" dy="30">Trial consumer impact review using</tspan><tspan x="28" dy="30">replay protection in a test environment.</tspan></text><rect x="608" y="226" width="580" height="202" rx="8" fill="#fff8e8" stroke="#a77619" stroke-width="2"/><text x="628" y="265" font-size="27" font-weight="700"><tspan x="628" dy="0">4 / Evidence and boundaries</tspan></text><text x="628" y="306" font-size="25" font-weight="400"><tspan x="628" dy="0">Retain decisions, tests and open gaps.</tspan><tspan x="628" dy="30">Business and architecture owners</tspan><tspan x="628" dy="30">check dependencies and conditions</tspan><tspan x="628" dy="30">to stop, narrow or broaden the trial.</tspan></text></g></svg>