<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="248" viewBox="0 0 1200 248" role="img" aria-labelledby="title desc"><title id="title">From a finding to a sustained improvement</title><desc id="desc">An unclear recovery guide prompts an owned decision, a consumer impact review practice and reusable evidence. The next change checks what still holds.</desc><metadata>APIOps Cycles / Osaango Ltd, CC-BY-SA 4.0. Paper 2 editorial illustration; fictional supplier-payment example. Not a canonical method canvas, assessment result or prescribed metro route.</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#555" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#252525"><rect x="8" y="20" width="276" height="160" rx="10" fill="#f0f5fd" stroke="#1656b8" stroke-width="2"/><text x="24" y="57" font-size="25" font-weight="700"><tspan x="24" dy="0">Finding</tspan></text><text x="24" y="104" font-size="24" font-weight="400"><tspan x="24" dy="0">Recovery guidance</tspan><tspan x="24" dy="30">is unclear.</tspan></text><path d="M288 100 h16" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="308" y="20" width="276" height="160" rx="10" fill="#f5f1fe" stroke="#7046b6" stroke-width="2"/><text x="324" y="57" font-size="25" font-weight="700"><tspan x="324" dy="0">Owned decision</tspan></text><text x="324" y="104" font-size="24" font-weight="400"><tspan x="324" dy="0">API, partner and</tspan><tspan x="324" dy="30">operations agree.</tspan></text><path d="M588 100 h16" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="608" y="20" width="276" height="160" rx="10" fill="#f0f5fd" stroke="#1656b8" stroke-width="2"/><text x="624" y="57" font-size="25" font-weight="700"><tspan x="624" dy="0">Changed practice</tspan></text><text x="624" y="104" font-size="24" font-weight="400"><tspan x="624" dy="0">Review consumer</tspan><tspan x="624" dy="30">impact in design.</tspan></text><path d="M888 100 h16" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="908" y="20" width="276" height="160" rx="10" fill="#f5f1fe" stroke="#7046b6" stroke-width="2"/><text x="924" y="57" font-size="25" font-weight="700"><tspan x="924" dy="0">Reusable evidence</tspan></text><text x="924" y="104" font-size="24" font-weight="400"><tspan x="924" dy="0">Keep decisions</tspan><tspan x="924" dy="30">and replay tests.</tspan></text><text x="12" y="226" font-size="24" font-weight="400"><tspan x="12" dy="0">On the next change: check assumptions, reuse what holds and revisit gaps.</tspan></text></g></svg>